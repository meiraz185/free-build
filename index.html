<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FREE BUILD</title>
  <meta name="description" content="A click-only 3D brick building sandbox." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='10' width='28' height='18' rx='3' fill='%23e0352b'/%3E%3Crect x='6' y='5' width='8' height='6' rx='2' fill='%23e0352b'/%3E%3Crect x='18' y='5' width='8' height='6' rx='2' fill='%23e0352b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
  </script>
</head>
<body>
  <div id="app">
    <aside id="panel" aria-label="Building tools">
      <header class="brand">
        <svg class="logo" viewBox="0 0 40 32" aria-hidden="true">
          <rect x="2" y="11" width="36" height="19" rx="4" fill="var(--accent)"/>
          <rect x="7" y="5" width="10" height="8" rx="2.5" fill="var(--accent)"/>
          <rect x="23" y="5" width="10" height="8" rx="2.5" fill="var(--accent)"/>
          <rect x="2" y="11" width="36" height="5" rx="2" fill="#fff" opacity=".22"/>
        </svg>
        <h1>FREE<br/>BUILD</h1>
      </header>

      <section>
        <h2>Brick</h2>
        <div class="bricks" id="bricks">
          <button class="brick-btn" data-type="1x1" aria-label="1 by 1 brick"><svg></svg><span>1×1</span></button>
          <button class="brick-btn" data-type="1x2" aria-label="1 by 2 brick"><svg></svg><span>1×2</span></button>
          <button class="brick-btn" data-type="2x2" aria-label="2 by 2 brick"><svg></svg><span>2×2</span></button>
          <button class="brick-btn" data-type="2x4" aria-label="2 by 4 brick"><svg></svg><span>2×4</span></button>
        </div>
      </section>

      <section>
        <h2>Color</h2>
        <div class="colors" id="colors"></div>
      </section>

      <section>
        <h2>Tools</h2>
        <div class="tools">
          <button class="tool" id="btn-select" title="Select a placed brick">
            <svg viewBox="0 0 24 24"><path d="M6 3l12 8-5.2 1.4L15.5 19l-2.7 1.2-2.7-6.4L6 17z"/></svg><span>Select</span>
          </button>
          <button class="tool" id="btn-rotate" title="Rotate brick 90°">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg><span>Rotate</span>
          </button>
          <button class="tool" id="btn-undo" title="Undo last action">
            <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Undo</span>
          </button>
          <button class="tool" id="btn-delete" title="Delete selected brick">
            <svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg><span>Delete</span>
          </button>
          <button class="tool" id="btn-reset" title="Clear the baseplate">
            <svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M4.6 15a8 8 0 1 0 1.9-8.3L4 10"/></svg><span>Reset</span>
          </button>
        </div>
      </section>

      <div class="grow"></div>
      <p class="count"><b id="count">0</b> <span id="count-label">bricks placed</span></p>
      <button id="btn-finish" class="finish">Finish
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
      </button>
    </aside>

    <main id="stage">
      <canvas id="scene" aria-label="3D building area"></canvas>

      <button id="btn-mute" class="round mute" title="Sound on / off" aria-pressed="false">
        <svg class="on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>

      <div class="cam" aria-label="Camera">
        <button class="round" id="cam-left" title="Rotate view left"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></button>
        <button class="round" id="cam-right" title="Rotate view right"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
        <span class="sep"></span>
        <button class="round" id="cam-in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="round" id="cam-out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      </div>

      <div id="hint" class="hint" role="status" aria-live="polite"></div>

      <div id="showcase" class="showcase" aria-hidden="true">
        <div class="title">
          <p class="kicker">Finished build</p>
          <h2>Your creation</h2>
          <p class="sub" id="showcase-sub"></p>
        </div>
        <div class="actions">
          <button id="btn-edit" class="pill ghost">
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>Keep building</button>
          <button id="btn-new" class="pill solid">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New creation</button>
        </div>
      </div>
    </main>
  </div>

  <noscript><p class="noscript">FREE BUILD needs JavaScript and WebGL.</p></noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
